<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hors ligne — Diako</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #0E7C86 0%, #10262B 100%); /* sarcelle et encre Diako */
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      text-align: center;
      max-width: 500px;
    }
    
    .icon {
      width: 120px;
      height: 120px;
      margin: 0 auto 30px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
    }
    
    h1 {
      font-size: 32px;
      margin-bottom: 15px;
      font-weight: 600;
    }
    
    p {
      font-size: 18px;
      margin-bottom: 30px;
      opacity: 0.9;
      line-height: 1.6;
    }
    
    .button {
      display: inline-block;
      padding: 14px 32px;
      background: rgba(255, 255, 255, 0.95);
      color: #0E7C86;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }
    
    .button:hover {
      background: #fff;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }
    
    .wifi-icon {
      position: relative;
      width: 60px;
      height: 60px;
      margin: 0 auto;
    }
    
    .wifi-icon::before,
    .wifi-icon::after {
      content: '';
      position: absolute;
      border: 3px solid #fff;
      border-radius: 50%;
      opacity: 0.4;
    }
    
    .wifi-icon::before {
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
    }
    
    .wifi-icon::after {
      width: 60%;
      height: 60%;
      top: 20%;
      left: 20%;
      opacity: 0.6;
    }
    
    .dot {
      width: 12px;
      height: 12px;
      background: #fff;
      border-radius: 50%;
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <div class="wifi-icon">
        <div class="dot"></div>
      </div>
    </div>
    <h1>Vous êtes hors ligne</h1>
    <p>
      Votre connexion internet semble interrompue. 
      Veuillez vérifier votre connexion et réessayer.
    </p>
    <a href="/" class="button">
      Réessayer
    </a>
  </div>
  
  <script>
    // Auto-reload when online
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
